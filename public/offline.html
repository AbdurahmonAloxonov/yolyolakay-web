<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Internet yo'q — YolYolakay</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1e181c" media="(prefers-color-scheme: dark)" />
  <style>
    /* Mustaqil sahifa — tashqi CSS/JS'siz (oflaynda hech narsa yuklanmaydi). */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff; --text: #1e181c; --muted: #6b6065; --accent: #c71578;
      --surface: #f7f2f4; --border: #e8dfe3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1e181c; --text: #f5eef2; --muted: #a99ba2; --surface: #2a2126; --border: #3a2f35; }
    }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .card { max-width: 22rem; }
    .logo {
      width: 72px; height: 72px; border-radius: 20px;
      margin: 0 auto 20px; display: block;
    }
    .badge {
      width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 20px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 6px; }
    .ru { margin-bottom: 24px; }
    button {
      appearance: none; border: none; cursor: pointer;
      background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; font-size: 1rem;
      padding: 14px 32px; border-radius: 14px;
      width: 100%;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.8; }
    .hint { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <!-- Ikonka SW keshida (install'da qo'shilgan) — oflaynda ham chiqadi; yuklanmasa alt belgisi. -->
    <div class="badge" aria-hidden="true">
      <img class="logo" src="/icon-192.png" alt="" width="72" height="72"
           onerror="this.parentElement.style.display='none'" style="margin:0" />
    </div>
    <h1>Internet aloqasi yo'q</h1>
    <p>Ulanish tiklangach, YolYolakay ishlashda davom etadi.</p>
    <p class="ru">Нет соединения с интернетом. Приложение продолжит работу после восстановления связи.</p>
    <button onclick="location.reload()">Qayta urinish · Повторить</button>
    <p class="hint" id="hint"></p>
  </div>
  <script>
    // Aloqa qaytishi bilan avtomatik qayta yuklaymiz — tugma bosishni kutmaymiz.
    window.addEventListener('online', function () { location.reload(); });
    if (navigator.onLine) {
      document.getElementById('hint').textContent =
        "Aloqa bor ko'rinadi — server javob bermayapti, birozdan so'ng urinib ko'ring.";
    }
  </script>
</body>
</html>
