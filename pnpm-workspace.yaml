allowBuilds:
  '@firebase/util': false
  # @sentry/cli postinstall'da binar yuklab oladi. U FAQAT source-map'ni Sentry'ga
  # yuborish uchun kerak, bu esa `SENTRY_AUTH_TOKEN` talab qiladi (bizda yo'q).
  # Tokensiz build'da bu qadam baribir o'tkazib yuboriladi → binar ham kerak emas.
  '@sentry/cli': false
  # esbuild — `tsx` ning ichki bog'liqligi (`scripts/check-cities.ts` shu bilan
  # ishlaydi). Postinstall platformaga mos binarni O'RNATADI, ya'ni ruxsat
  # bermasa tsx umuman ishga tushmaydi. Faqat DEV vositasi, reliz bundliga
  # kirmaydi.
  esbuild: true
  protobufjs: false

# Tranzit bog'liqliklarni majburan yangilash (2026-08-02, `pnpm audit`).
# Ikkalasi ham next'dan keladi va next ularni ESKI qilib qotirgan:
#   next@16.2.12 -> postcss "8.4.31" (aniq versiya), sharp "^0.34.5" (optional).
# pnpm 11 dan boshlab overrides package.json'da EMAS, shu yerda o'qiladi.
#
#   postcss <8.5.18 — path traversal (source-map avto-yuklash) + arbitrary file read
#                     + `</style>` ekranlanmagani uchun XSS. Faqat build vaqtida
#                     ishlaydi, lekin tuzatish arzon.
#   sharp   <0.35.0 — libvips CVE'lari (CVE-2026-33327 va h.k.).
#
# Override olib tashlansa `pnpm audit --prod` yana 4 ta ogohlantirish beradi —
# avval next o'z pinlarini yangilaganini tekshiring.
#   brace-expansion — @sentry/nextjs bundler-plugin'idan keladi (glob -> minimatch).
#     5.0.8 dan past versiyalarda DoS (eksponensial kengayish). Faqat BUILD vaqtida
#     ishlaydi, lekin override arzon. DIQQAT: `5.0.6` va `1.1.15` ikkalasi ham
#     o'rnatilgan — override 5.x shoxiga tegadi, 1.x (boshqa paketlarniki) o'z holida
#     qoladi, chunki advisory diapazoni >=3.0.0.
overrides:
  postcss: ^8.5.18
  sharp: ^0.35.3
  brace-expansion@>=3: ^5.0.8
